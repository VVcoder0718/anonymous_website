<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Anonymous CodeShare</title>

    <!-- Styles -->
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #58a6ff;
        }

        .logo span {
            color: #f0883e;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .room-id {
            background: #21262d;
            padding: 6px 12px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #58a6ff;
        }

        .btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #30363d;
            border-color: #58a6ff;
        }

        .btn-primary {
            background: #238636;
            border-color: #238636;
            color: white;
        }

        .btn-primary:hover {
            background: #2ea043;
            border-color: #2ea043;
        }

        /* Editor */
        .editor-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #30363d;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
            flex-wrap: wrap;
            align-items: center;
        }

        .toolbar .btn {
            padding: 6px 14px;
            font-size: 13px;
        }

        .status {
            margin-left: auto;
            font-size: 13px;
            color: #3fb950;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #3fb950;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .status.offline {
            color: #f85149;
        }

        .status.offline::before {
            background: #f85149;
        }

        textarea {
            flex: 1;
            background: #0d1117;
            color: #c9d1d9;
            border: none;
            padding: 20px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.7;
            resize: none;
            outline: none;
            min-height: 300px;
        }

        textarea::placeholder {
            color: #484f58;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #21262d;
            color: #c9d1d9;
            padding: 12px 24px;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* Screenshot mode */
        .screenshot-mode {
            background: white !important;
            color: black !important;
        }

        .screenshot-mode textarea {
            background: white !important;
            color: black !important;
        }

        .screenshot-mode .toolbar {
            background: #f0f0f0 !important;
            border-bottom-color: #ddd !important;
        }

        .screenshot-mode .header {
            border-bottom-color: #ddd !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .room-info {
                justify-content: center;
            }

            .logo {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">📝 Code<span>Share</span></div>
            <div class="room-info">
                <span>Room:</span>
                <span class="room-id" id="roomId">Loading...</span>
                <button class="btn" onclick="copyUrl()">📋 Copy URL</button>
                <button class="btn btn-primary" onclick="newRoom()">✨ New Room</button>
            </div>
        </header>

        <!-- Editor -->
        <div class="editor-wrapper" id="editorWrapper">
            <div class="toolbar">
                <button class="btn" onclick="takeScreenshot()">📸 Screenshot</button>
                <button class="btn" onclick="downloadContent()">💾 Download</button>
                <button class="btn" onclick="clearContent()">🗑️ Clear</button>
                <span class="status" id="status">Connected</span>
            </div>
            <textarea id="editor" placeholder="Start typing or paste your code here..."></textarea>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Libraries -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <!-- Main Script -->
    <script>
        // ============================================
        // 1. ROOM MANAGEMENT
        // ============================================

        // Get or create room ID
        function getRoomId() {
            // Check if URL has a room ID
            const path = window.location.pathname;
            const parts = path.split('/');
            const room = parts[parts.length - 1];

            // If there's a room ID in URL, use it
            if (room && room.length > 0 && room !== 'index.html') {
                return room;
            }

            // Otherwise generate a new one
            return generateRoomId();
        }

        function generateRoomId() {
            return Math.random().toString(36).substring(2, 8);
        }

        // Initialize room
        const roomId = getRoomId();
        document.getElementById('roomId').textContent = roomId;

        // Update URL without page reload
        if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
            const newUrl = window.location.origin + '/' + roomId;
            window.history.replaceState({}, '', newUrl);
        }

        // ============================================
        // 2. LOCAL STORAGE (Save content)
        // ============================================

        const editor = document.getElementById('editor');
        const STORAGE_KEY = 'codeshare_' + roomId;

        // Load saved content
        function loadContent() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    editor.value = saved;
                }
            } catch (e) {
                // Ignore
            }
        }

        // Save content
        function saveContent() {
            try {
                localStorage.setItem(STORAGE_KEY, editor.value);
            } catch (e) {
                // Ignore
            }
        }

        // Auto-save on typing
        editor.addEventListener('input', saveContent);

        // Load content on page load
        loadContent();

        // ============================================
        // 3. COPY URL
        // ============================================

        function copyUrl() {
            const url = window.location.href;

            if (navigator.clipboard) {
                navigator.clipboard.writeText(url)
                    .then(() => showToast('✅ URL copied!'))
                    .catch(() => fallbackCopy(url));
            } else {
                fallbackCopy(url);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showToast('✅ URL copied!');
            } catch (e) {
                showToast('❌ Please copy manually: ' + text);
            }

            document.body.removeChild(textarea);
        }

        // ============================================
        // 4. CREATE NEW ROOM
        // ============================================

        function newRoom() {
            const newId = generateRoomId();
            window.location.href = '/' + newId;
        }

        // ============================================
        // 5. DOWNLOAD CONTENT
        // ============================================

        function downloadContent() {
            const content = editor.value || '// Empty file';
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = `codeshare-${roomId}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast('💾 Downloaded!');
        }

        // ============================================
        // 6. CLEAR CONTENT
        // ============================================

        function clearContent() {
            if (confirm('Clear all content?')) {
                editor.value = '';
                saveContent();
                showToast('🗑️ Cleared');
            }
        }

        // ============================================
        // 7. SCREENSHOT
        // ============================================

        function takeScreenshot() {
            const wrapper = document.getElementById('editorWrapper');
            const originalBg = document.body.style.background;

            // Add screenshot mode (white background for better visibility)
            document.body.style.background = '#ffffff';
            wrapper.classList.add('screenshot-mode');

            // Small delay for styles to apply
            setTimeout(() => {
                html2canvas(wrapper, {
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    allowTaint: true,
                    useCORS: true
                })
                    .then(canvas => {
                        // Restore original styles
                        document.body.style.background = originalBg;
                        wrapper.classList.remove('screenshot-mode');

                        // Download screenshot
                        const link = document.createElement('a');
                        link.download = `codeshare-${roomId}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();

                        showToast('📸 Screenshot saved!');
                    })
                    .catch(err => {
                        console.error('Screenshot error:', err);
                        document.body.style.background = originalBg;
                        wrapper.classList.remove('screenshot-mode');
                        showToast('❌ Screenshot failed');
                    });
            }, 100);
        }

        // ============================================
        // 8. TOAST NOTIFICATIONS
        // ============================================

        let toastTimeout = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================
        // 9. KEYBOARD SHORTCUTS
        // ============================================

        document.addEventListener('keydown', (e) => {
            // Ctrl+S = Screenshot
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                takeScreenshot();
            }

            // Ctrl+D = Download
            if (e.ctrlKey && e.key === 'd') {
                e.preventDefault();
                downloadContent();
            }
        });

        // ============================================
        // 10. DISPLAY ROOM INFO IN CONSOLE
        // ============================================

        console.log('📝 CodeShare Room');
        console.log('🔗 Share this URL:', window.location.href);
        console.log('🏠 Room ID:', roomId);
        console.log('💾 Content saved locally');

        // ============================================
        // 11. OPTIONAL: P2P REAL-TIME SYNC (via PeerJS)
        // ============================================

        // You'll need to include PeerJS library

    </script>
</body>

</html>
